name: Run Tests

# The cosmology program (#488) accumulates on the long-lived integration branch
# feat/cosmology-program: each delegate branches off it, and only the finished programme
# lands on main.  Testing only pull requests into main therefore left both of the moments
# that matter unobserved -- a delegate finishing an issue, and a merge into the integration
# branch -- so "the lane is green" was unverifiable at merge time (#524).
#
# pull_request filters on the *base* branch and runs from the merge commit, so a pull
# request from a cosmo/* branch into feat/cosmology-program is covered by the entry below
# without needing a push trigger on a branch glob (which would double up against the pull
# request).  workflow_dispatch only dispatches workflows already present on the default
# branch, so it is inert until this merges to main.
on:
  pull_request:
    branches:
      - main
      - feat/cosmology-program
  push:
    branches:
      - feat/cosmology-program
  workflow_dispatch:

# Collapse superseded runs of the same branch and event.  The event is part of the key on
# purpose: a push and a pull request describe different commits (the branch tip and the
# merge commit), so cancelling one because the other started would hide a real result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --all-extras

      - name: Run lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run type check
        run: uv run pyright

      - name: Run tests with coverage
        run: uv run pytest --cov=tidal --cov=tidalcosmo --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v7
        with:
          use_cspell_files: true
          strict: true
          incremental_files_only: true
