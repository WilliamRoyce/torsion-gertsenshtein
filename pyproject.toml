[project]
name = "tidal"
version = "0.53.0"
description = "TIDAL: Tensor Integration and Derivation for Any Lagrangian"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "William Royce" }]
keywords = [
    "physics",
    "pde",
    "simulation",
    "gravitational-waves",
    "electromagnetic-waves",
    "numerical-methods",
    "tensor-calculus",
    "differential-geometry",
    "general-relativity",
    "torsion",
    "gertsenshtein",
    "symbolic-computation",
    "xact",
    "wolfram",
    "field-theory",
    "lagrangian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Other",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.1,<4.0",
    "numpy>=1.22,<3.0",
    "scipy>=1.10,<2.0",
    "scikit-sundae>=1.1.2,<2.0",
    "tqdm>=4.60",
    "typing-extensions>=4.0 ; python_version < '3.12'",
]

[project.optional-dependencies]
wolfram = ["wolframclient>=1.4.0,<2.0"]
sensitivity = ["SALib>=1.4"]
inference = ["anesthetic>=2.0"]
jax = ["jax>=0.4.20", "jaxlib>=0.4.20"]
# pypolychord: install manually (requires gfortran):
#   git clone https://github.com/PolyChord/PolyChordLite /tmp/PolyChordLite
#   cd /tmp/PolyChordLite && pip install --no-build-isolation --config-settings="--global-option=--no-mpi" .
# On HPC with MPI: pip install . (no --no-mpi flag)
completion = ["shtab>=1.5"]
color = ["rich-argparse>=1.4"]
# Cosmology program (#488).  No upper bounds: SOLikeT's `camb<2` is a live example of a
# metadata pin stranding a package a major version behind its ecosystem.
camb = ["camb>=2.0.3"]
cobaya = ["cobaya>=3.5.5"]
# camb and cobaya are extras only while nothing under tidalcosmo/ imports them.  They become
# core dependencies on a stated trigger (repo_reshape.md section 9, amended 2026-09-06):
#   camb   -> core at M1a (#532), when background/camb_seam.py imports it
#   cobaya -> core at M1b, when __init__.py re-exports a Cobaya component (section 2.11)
# That re-export is what gives the short dotted path (tidal.SpectatorTheory:), and it also
# makes `import tidalcosmo` itself require cobaya -- which reaches pyright, coverage, the
# package boundary test and any doc build, not only Cobaya runs.  So cobaya cannot stay
# optional past M1b.  Both extras are deleted at the section 1.3 rename, when the surviving
# package is a Cobaya extension and they are simply core dependencies.
#
# The forked CAMB carrying the tabulated (rho, P) background hook is NOT a fourth extra: per
# the H1 audit section 7.2 the package depends on that branch only when the feature is
# enabled, the default install takes stock CAMB from PyPI with no Fortran build, and the fork
# does not exist yet -- it is M2 (#498), and a forked-CAMB extra lands there.
all = ["tidal[camb,cobaya,wolfram,sensitivity,inference,jax,completion,color]"]

[project.scripts]
tidal = "tidal.cli:main"
# Both console scripts coexist during the transition (D3); at the section 1.3 rename
# tidalcosmo becomes tidal and this pair collapses back to one.
tidalcosmo = "tidalcosmo.cli:main"

[project.urls]
Homepage = "https://github.com/WilliamRoyce/tidal"
Documentation = "https://williamroyce.github.io/tidal/"
Repository = "https://github.com/WilliamRoyce/tidal"
Issues = "https://github.com/WilliamRoyce/tidal/issues"
Changelog = "https://github.com/WilliamRoyce/tidal/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ruff",
    "pytest >=8.3.3,<9.0.0",
    "pytest-cov >=6.0.0,<7.0.0",
    "pyright ==1.1.403",
    "sphinx >=8.1.3,<9.0.0",
    "pydata-sphinx-theme >=0.16.0,<0.17.0",
    "myst-parser >=4.0.0,<5.0.0",
    "ruamel.yaml >=0.18.0,<0.19.0",
    "mpmath>=1.4.1",
]


[tool.ruff]
unsafe-fixes = true
exclude = [".git", ".git-rewrite", ".vscode"]

[tool.ruff.lint]
select = ["ALL"]
preview = true
ignore = [
    "COM812",
    "E501",
    "S101",
    "PT009",
    "D100",
    "D105",
    "CPY001",
    "TD003",
    "TD002",
    "DOC201",
    "DOC402",
    "PD",
    "RUF001",  # physics code intentionally uses Unicode Greek/math symbols in strings
    "RUF002",  # physics docstrings intentionally use Unicode Greek/math symbols
    "RUF003",  # physics code intentionally uses Unicode Greek/math symbols in comments
]
fixable = ["ALL"]
unfixable = ["T201"]


