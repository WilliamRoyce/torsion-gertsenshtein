[tool.ruff.lint.pylint]
allow-dunder-method-names = [
    "__as_fundamental__",
    "__from_fundamental__",
    "__into_fundamental__",
    "__as_transformed__",
    "__into_transformed__",
    "__from_transformed__",
    "__convert_vector_into__",
    "__into_inner__",
    "__from_inner__",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
testpaths = ["tests", "tests_cosmo"]
markers = [
    "slow: integration test with non-trivial compute (simulate, derive, etc.); runs in default lane but can be skipped with `-m 'not slow'`.",
    "publication: tests of the App C publication pipeline (manifest, canonical data, table/figure scripts); skipped by default, run with `-m publication tests/publication/`.",
    "publication_slow: subset of publication tests that build PDFs via matplotlib; skipped within `publication` unless explicitly requested.",
]

[tool.coverage.run]
source = ["tidal", "tidalcosmo"]
omit = ["*/tests/*", "*/tests_cosmo/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.package-data]
tidal = ["py.typed", "wolfram/*.wl"]
# The recursive glob is required, not stylistic.  Cobaya finds a component's defaults with a
# bare os.path.exists() next to inspect.getfile(cls), and returns None *silently* when the
# file is absent -- so an unshipped YAML costs you the defaults with no error.  The common
# `"*" = ["*.yaml"]` idiom only reaches directories that are themselves packages, which would
# drop a presets/ subtree that has no __init__.py (repo_reshape.md sections 2.11, 3, 9).
tidalcosmo = ["py.typed", "**/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
# "tidal*" already glob-matches tidalcosmo; naming it is documentation, so that the second
# root is not left resting on a coincidence of the first one's name (section 9).
include = ["tidal*", "tidalcosmo*"]
exclude = ["outputs*", "tests*", "docs*"]
